# Reverse proxy configuration that fronts the frontend and FastAPI backend.
events {}

http {
  # Map Docker service names to locally resolvable upstreams.
  upstream frontend_app {
    server frontend:5173;
  }

  # Backend service exposes the FastAPI application.
  upstream backend_api {
    server backend:8080;
  }

  # Primary virtual host terminating HTTP traffic from the public endpoint.
  server {
    listen 80;
    server_name assistant.joshgill.dev;

    # Forward API calls to FastAPI, stripping the /api prefix
    location /api/ {
      proxy_pass http://backend_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle exact /api path (no trailing slash)
    location = /api {
      proxy_pass http://backend_api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else goes to the Vite frontend dev server
    location / {
      proxy_pass http://frontend_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
