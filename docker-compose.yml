services:
  # Local model runtime powering chat completions.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # On first start you'll pull a model:
    # docker exec -it <container> ollama pull phi3:mini

  # FastAPI backend that mediates between the frontend, LLM, and Google APIs.
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      OLLAMA_ENDPOINT: http://ollama:11434
      MODEL_NAME: phi3:mini
      CORS_ORIGINS: https://api.assistant.joshgill.dev,https://assistant.joshgill.dev,http://localhost:5173,http://localhost:8080
      GOOGLE_CRED_PATH: /run/secrets/google_credentials
      GOOGLE_TOKEN_PATH: /data/google_token.json
    ports:
      - "8080:8080"
    depends_on:
      - ollama
    volumes:
      - backend_data:/data
      - ./secrets/google/credentials.json:/run/secrets/google_credentials
      - ./secrets/google/token.json:/data/google_token.json
    secrets:
      - google_credentials
    command: ["uvicorn","app.main:app","--host","0.0.0.0","--port","8080"]

  # React + Vite frontend served via the Vite dev server in development.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-}
    ports:
      - "5173:5173"
    command: ["npm","run","dev","--","--host","0.0.0.0"]
    depends_on:
      - backend

  # Nginx reverse proxy exposing both frontend assets and the API.
  proxy:
    image: nginx:alpine
    depends_on:
      - frontend
      - backend
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8081:80"

secrets:
  # Google OAuth client secret made available to the backend container.
  google_credentials:
    file: ./secrets/google/credentials.json

volumes:
  # Persist local model weights and backend-issued Google tokens.
  ollama:
  backend_data:
