# pyproject (poetry) example
[tool.poetry]
name = "pi-assistant"
version = "0.1.0"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras=["standard"], version="^0.30.0"}
httpx = "^0.27.0"
pydantic = "^2.8.0"
google-api-python-client = "^2.143.0"
google-auth-oauthlib = "^1.2.1"
google-auth = "^2.33.0"
python-dateutil = "^2.9.0.post0"
